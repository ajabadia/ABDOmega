id: juno_dco
name: JUNO DCO
family: osc
version: "6.1.0"
status: stable
description: "Authentic digitally controlled oscillator from the Roland Juno-60 era. Features Saw, Pulse, and Sub-oscillator sections with PWM."

registry:
  - id: osc.saw_on
    label: SAW
    type: bool
    roles: ["control"]
    presentation:
      tab: MAIN
      group: OSCILLATORS
      order: 1
      ui: { component: "toggle", variant: "juno-red" }

  - id: osc.pulse_on
    label: PULSE
    type: bool
    roles: ["control"]
    presentation:
      tab: MAIN
      group: OSCILLATORS
      order: 2
      ui: { component: "toggle", variant: "juno-red" }

  - id: osc.sub_level
    label: SUB
    type: float
    roles: ["control", "mod_target"]
    range: { min: 0, max: 1, default: 0 }
    presentation:
      tab: MAIN
      group: MIXER
      order: 3
      ui: { component: "slider_v" }
      attachments:
        - { type: "label", position: "bottom" }

  - id: osc.noise_level
    label: NOISE
    type: float
    roles: ["control", "mod_target"]
    range: { min: 0, max: 1, default: 0 }
    presentation:
      tab: MAIN
      group: MIXER
      order: 4
      ui: { component: "slider_v" }
      attachments:
        - { type: "label", position: "bottom" }

  - id: osc.lfo_depth
    label: LFO
    type: float
    roles: ["control", "mod_target"]
    range: { min: 0, max: 1, default: 0 }
    presentation:
      tab: MAIN
      group: MODULATION
      order: 5
      ui: { component: "knob" }

  - id: osc.pwm_amount
    label: PWM
    type: float
    roles: ["control", "mod_target"]
    range: { min: 0, max: 1, default: 0 }
    presentation:
      tab: MAIN
      group: MODULATION
      order: 6
      ui: { component: "slider_v" }

  - id: out.audio
    label: AUDIO OUT
    type: audio
    roles: ["stream", "output"]
    presentation:
      tab: PATCHING
      ui: { component: "port" }
      attachments:
        - { type: "led", position: "right", role: "activity" }
