# OMEGA ACE Component Definition: Roland RE-201 Space Echo
id: FX-DL-002
name: Roland RE-201 Space Echo
family: FX
engine: VirtualAnalog
modelId: RE-201
origin: Roland (1974)
status: active
version: 1
tags: [tape, echo, delay, spring, reverb, dub, vintage]

parameters:
  - id: speed
    label: Repeat Rate (Tape Speed)
    unit: Hz
    min: 0.0
    max: 1.0
    defaultValue: 0.5
  - id: intensity
    label: Intensity (Feedback)
    unit: lin
    min: 0.0
    max: 1.0
    defaultValue: 0.4
  - id: echo_vol
    label: Echo Volume
    unit: dB
    min: 0.0
    max: 1.0
    defaultValue: 0.5
  - id: reverb_vol
    label: Reverb Volume
    unit: dB
    min: 0.0
    max: 1.0
    defaultValue: 0.3
  - id: mode
    label: Mode Selector
    unit: mode
    min: 1
    max: 12
    defaultValue: 1
  - id: wow_flutter
    label: Wow & Flutter (Age)
    unit: %
    min: 0.0
    max: 1.0
    defaultValue: 0.2
  - id: drive
    label: Input Tape Drive
    unit: sat
    min: 0.0
    max: 1.0
    defaultValue: 0.5

modulationTargets:
  - id: tape_speed
    label: Tape Speed
  - id: intensity
    label: Feedback Intensity
  - id: echo_mix
    label: Echo Mix
