id: "midi_2_cv"
name: "MIDI to CV Converter"
family: "Utility"
engine: "Modular"
modelId: "ACE-UTIL-MCV"
origin: "ABD OMEGA"
status: "active"
version: 1
panelClass: "utility-panel"
description: "Standard MIDI to CV converter. Extracts Pitch, Gate, and Velocity signals from incoming MIDI data for internal routing."
illustration: "midi_2_cv/illustration.svg"
tags: ["midi", "cv", "utility", "converter"]
parameters:
  - id: "midiChannel"
    label: "CHANNEL"
    unit: "ch"
    min: 0
    max: 16
    default: 0
ports:
  - id: "midi_in"
    label: "MIDI IN"
    type: "midi"
    direction: "input"
  - id: "pitch"
    label: "PITCH (Hz)"
    type: "cv"
    direction: "output"
  - id: "trigger"
    label: "GATE"
    type: "gate"
    direction: "output"
  - id: "velocity"
    label: "VELOCITY"
    type: "cv"
    direction: "output"
uiLayout:
  columns: 1
  rows: 3
  items:
    - { id: "chan_sel", control: "select", paramId: "midiChannel", row: 0, col: 0 }
    - { id: "pitch_out", control: "port", portId: "pitch", row: 1, col: 0, label: "PITCH" }
    - { id: "gate_out", control: "port", portId: "trigger", row: 2, col: 0, label: "GATE" }
footer:
  label: "CONVERTER UTILITY"
