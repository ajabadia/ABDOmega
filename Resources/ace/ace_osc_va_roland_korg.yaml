components:
  - id: OSC-VA-001
    name: Juno DCO
    family: Oscillator
    engine: VirtualAnalog
    modelId: RolandJunoDco
    origin: Roland Juno-106
    status: active
    version: 1
    tags: [va, roland, juno, dco]
    parameters:
      - id: tune
        label: Tune
        unit: semitones
        min: -24.0
        max: 24.0
        default: 0.0
      - id: pulsewidth
        label: Pulse Width
        unit: norm
        min: 0.0
        max: 1.0
        default: 0.5
      - id: sub
        label: Sub level
        unit: norm
        min: 0.0
        max: 1.0
        default: 0.0
    modulationTargets:
      - id: pitch
        label: Pitch
        unit: semitones
      - id: pw
        label: Pulse Width
        unit: norm
  - id: OSC-VA-002
    name: Korg MS-20 VCO
    family: Oscillator
    engine: VirtualAnalog
    modelId: KorgMs20Vco
    origin: Korg MS-20
    status: active
    version: 1
    tags: [va, korg, ms20, vco]
    parameters:
      - id: tune
        label: Tune
        unit: semitones
        min: -24.0
        max: 24.0
        default: 0.0
      - id: wave
        label: Waveform
        unit: enum
        options: [ "Tri", "Saw", "Pulse", "Noise" ]
        default: 1
    modulationTargets:
      - id: pitch
        label: Pitch
        unit: semitones

  - id: OSC-VA-004
    name: Roland Supersaw
    family: Oscillator
    engine: VirtualAnalog
    modelId: RolandJp8000Supersaw
    origin: Roland JP-8000
    status: active
    version: 1
    tags: [va, roland, supersaw]
    parameters:
      - id: detune
        label: Detune
        unit: norm
        min: 0.0
        max: 1.0
        default: 0.1
      - id: spread
        label: Spread
        unit: norm
        min: 0.0
        max: 1.0
        default: 0.5
    modulationTargets:
      - id: pitch
        label: Pitch
        unit: semitones

  - id: OSC-PM-010
    name: Roland Feedback Saw
    family: Oscillator
    engine: PulseModulation
    modelId: RolandJp8080FeedbackSaw
    origin: Roland JP-8080
    status: active
    version: 1
    tags: [pm, roland, jp8080, feedback, saw]
    parameters:
      - id: feedback
        label: Feedback
        unit: norm
        min: 0.0
        max: 1.0
        default: 0.5

  - id: OSC-PM-011
    name: Roland Dual Osc
    family: Oscillator
    engine: PulseModulation
    modelId: RolandJp8080DualOsc
    origin: Roland JP-8080
    status: active
    version: 1
    tags: [pm, roland, jp8080, dual]
