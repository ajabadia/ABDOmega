preset:
  name: "MS-20 ESP Modular Patch"
  author: "ABD-IA"
  engine: "VirtualAnalog"
  
  components:
    osc1: 
      id: "OSC-VA-002" # Korg VCO
      params:
        wave: "Saw"
        pitch: 0.0
    filter:
      id: "FLT-VA-003" # KORG35
      params:
        lpCutoff: 1200.0
        lpResonance: 1.5
        hpCutoff: 400.0
        grit: 2.5

  # Virtual Patching (ModulationGraph)
  # Emulamos cables físicos conectando la salida del ESP a destinos de síntesis
  modulation:
    - source: "EspEnvelope"
      destination: "FilterCutoff"
      amount: 0.8
      description: "External Signal intensity opens filter"
    
    - source: "EspPitch"
      destination: "OscPitch"
      amount: 1.0
      description: "External Signal frequency follows internal VCO"

    - source: "LFO1"
      destination: "FilterHighPassCutoff"
      amount: 0.3
      description: "Classic MS-20 HP Vibe"

    - source: "EspTrigger"
      destination: "EnvelopeGate"
      amount: 1.0
      description: "External signal starts synth voice"

  esp_config:
    gain: 2.0
    bpfFreq: 1000.0
    attack: 0.01
    release: 0.2
    threshold: 0.15
