id: "debug_test"
name: "THEME VALIDATOR"
modelId: "ACE-DEBUG-VALIDATOR"
implementationId: 999
family: "Utility"
panelClass: "utility-panel"
engine: "Modular"
visible: true
rack: "lower"
uiLayout:
  columns: 3
  rows: 4
  gap: 12
  items:
    - { id: "knob_a", semantic: "scalar", look: "knob", variant: "A", label: "KNOB A", row: 0, col: 0 }
    - { id: "knob_b", semantic: "scalar", look: "knob", variant: "B", label: "KNOB B", row: 0, col: 1 }
    - { id: "knob_c", semantic: "scalar", look: "knob", variant: "C", label: "KNOB C", row: 0, col: 2 }
    
    - { id: "oled_a", semantic: "list", look: "display", variant: "A", label: "DISP A", row: 1, col: 0 }
    - { id: "oled_b", semantic: "list", look: "display", variant: "B", label: "DISP B", row: 1, col: 1 }
    - { id: "oled_c", semantic: "list", look: "display", variant: "C", label: "DISP C", row: 1, col: 2 }

    - { id: "led_a", semantic: "telemetry", look: "led", variant: "A", color: "red", label: "LED A", row: 2, col: 0 }
    - { id: "led_b", semantic: "telemetry", look: "led", variant: "B", color: "green", label: "LED B", row: 2, col: 1 }
    - { id: "led_c", semantic: "telemetry", look: "led", variant: "C", color: "cyan", label: "LED C", row: 2, col: 2 }

    - { id: "jack_v", semantic: "port", look: "jack", portId: "in_v", label: "VOLT", row: 3, col: 0 }
    - { id: "jack_m", semantic: "port", look: "jack", portId: "in_m", label: "MIDI", row: 3, col: 1 }
    - { id: "jack_a", semantic: "port", look: "jack", portId: "in_a", label: "AUDIO", row: 3, col: 2 }

ports:
  - { id: "in_v", label: "V", type: "voltage", direction: "input" }
  - { id: "in_m", label: "M", type: "midi", direction: "input" }
  - { id: "in_a", label: "A", type: "float", direction: "input" }

parameters:
  - id: "test_label"
    label: "MODULE TAG"
    semantic: "text"
    default: "DEBUG_UNIT_01"
  - id: "limit_min"
    label: "LIMIT MIN"
    min: 0
    max: 100
    default: 10
  - id: "limit_max"
    label: "LIMIT MAX"
    min: 0
    max: 100
    default: 90
  - id: "cutoff_low"
    label: "CUTOFF LOW"
    min: 20
    max: 20000
    default: 100
    unit: "Hz"
  - id: "cutoff_high"
    label: "CUTOFF HIGH"
    min: 20
    max: 20000
    default: 12000
    unit: "Hz"
  - id: "calibration_offset"
    label: "CALIBRATION"
    min: -10
    max: 10
    default: 0
    unit: "dB"
