# OMEGA Hyper-ACE: Template Module (V1.0)
# Copia este archivo para crear tu nuevo módulo.

id: "UTIL-TEMPLATE-001"
name: "ACE SDK Template"
family: "util"
engine: "None"
status: "experimental"
version: 1

# --- Definición de Parámetros ---
# Los parámetros registrados aquí aparecerán en la automatización del DAW.
parameters:
  - id: "gain"
    label: "Output Gain"
    min: -60.0
    max: 12.0
    default: 0.0
    unit: "dB"
  
  - id: "mode"
    label: "Filter Mode"
    min: 0
    max: 2
    default: 0
    unit: "enum"

# --- Objetivos de Modulación (Patchbay-Matrix) ---
modulationTargets:
  - id: "gain"
    label: "Gain Mod"
    unit: "dB"

# --- Gobernanza Visual (Dynamic UI) ---
# Define la estética del panel y su estructura de rejilla.
style: "ms20-panel"    # Estética MS-20 (oscura con knobs metálicos)

uiLayout:
  grid:
    columns: 2      # El panel se divide en 2 columnas principales
    gap: "medium"   # Espaciado entre componentes (small, medium, large)
    items:
      - type: "knob"
        id: "gain"
        label: "GAIN"
        variant: "white-cap"    # Estilo de knob (white-cap, black, juno-red)
      
      - type: "select"
        id: "mode"
        label: "FILTER MODE"
        options: ["LP", "BP", "HP"]
      
      - type: "toggle"
        id: "bypass"
        label: "BYPASS"
        variant: "juno-red"     # Botón estilo Juno (rojo si activo)
      
      - type: "spacer"
        size: "10px"            # Espaciador vertical opcional

---
# Notas:
# 1. Guarda este archivo en Resources/ace/
# 2. Registra el nombre del archivo en Resources/ace/aceindex.yaml
# 3. El Rack de OMEGA lo cargará dinámicamente al iniciar.
