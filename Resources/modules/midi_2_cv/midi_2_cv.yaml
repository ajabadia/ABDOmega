# OMEGA Module Manifest - Era 5.2 (Gold Standard)
# MIDI-2-CV : Flagship Meta-Engine Adapter (Aseptic Edition)

id: "midi_2_cv"
modelId: "ACE-MIDI-ADAPTER-ULTIMATE"
implementationId: 502
version: "5.2.0"
family: "utility"
engine: "Modular"
tags: ["midi_to_cv", "adapter"]
description: "Flagship OMEGA Meta-Engine Adapter. Converters Polyphonic MIDI to high-resolution CV/Gate streams with Era 5.2 aseptic precision."

# --- Definición Física (CAD) ---
layout:
  hp: 8                # Ancho dinámico (Living YAML)
  min_hp: 6
  rack: "upper"        # Utility global (Rack Superior)
  ui_class: "ModuleMidiToCv"
  columns: 2           # Referencia para auto-layout
  uiLayout:
    columns: 2
    gap: 15
    items:
      - { paramId: "midi_channel", row: 0, col: 0, look: "select" }
      - { paramId: "transpose", row: 0, col: 1, look: "knob" }
      - { paramId: "bend_range", row: 1, col: 0, look: "knob" }
      - { paramId: "glide_time", row: 1, col: 1, look: "knob" }
      - { paramId: "mod_wheel", row: 2, col: 0, colSpan: 2, look: "slider-h" }

registry:
  # ===========================================================================
  # TUNING & CONNECTIVITY (Pestaña MAIN)
  # ===========================================================================
  
  - id: "midi_channel"
    label: "MIDI CHANNEL"
    type: int
    direction: input
    import: "core.midi.channels"
    roles: [control]
    front: true
    back: false
    presentation:
      tab: "MAIN"
      group: "CONNECTIVITY"
      order: 1
      ui: { component: list }

  - id: "transpose"
    label: "TRANSPOSE"
    type: int
    direction: input
    range: { min: -24, max: 24, default: 0 }
    roles: [control]
    front: true
    back: false
    presentation:
      tab: "MAIN"
      group: "TUNING"
      order: 1
      ui: 
        component: knob
        ui_precision: 0
        attachments:
          - { type: "display", label: "Semitones" }

  - id: "bend_range"
    label: "BEND RANGE"
    type: int
    direction: input
    range: { min: 0, max: 24, default: 2 }
    roles: [control, mod_target]
    presentation: 
      tab: "MAIN"
      group: "TUNING"
      order: 2
      ui: { component: knob }
    midi: { cc: 102, learnable: true }

  # ===========================================================================
  # EXPRESSION CELLS (Apilamiento Vertical)
  # ===========================================================================

  - id: "mod_wheel"
    label: "MODULATION"
    type: float
    precision: 8
    direction: output
    range: { min: 0.0, max: 1.0, default: 0.0 }
    roles: [control, stream, output]
    midi: { cc: 1, auto_bind: true }
    presentation: 
      tab: "MAIN"
      group: "EXPRESSION"
      order: 1
      ui:
        component: slider
        ui_precision: 2
        attachments:
          - { type: "led", bind: "self.signal" } # LED brilla con el valor del ModWheel
          - { type: "display", label: "Depth" }

  - id: "glide_time"
    label: "GLIDE"
    type: float
    precision: 4
    direction: input
    range: { min: 0.0, max: 10.0, default: 0.0 }
    roles: [control, mod_target]
    presentation: 
      tab: "MAIN"
      group: "EXPRESSION"
      order: 2
      ui: 
        component: knob
        ui_precision: 1
        attachments:
          - { type: "display", unit: "s" }

  # ===========================================================================
  # PATCHING SANCTUARY (Sin Jacks en Frontal)
  # ===========================================================================

  - id: "pitch_out"
    label: "PITCH CV"
    type: float
    precision: 12
    direction: output
    roles: [stream, output]
    presentation: { tab: "PATCHING", order: 1 }

  - id: "gate_out"
    label: "GATE"
    type: bool
    direction: output
    roles: [stream, output]
    import: "core.logic.boolean"
    presentation: { tab: "PATCHING", order: 2 }

  # ===========================================================================
  # EXPERT & CALIBRATION (Pestaña SETUP)
  # ===========================================================================

  - id: "gate_fade_in"
    label: "FADE IN"
    type: float
    precision: 2
    direction: input
    range: { min: 0.0, max: 20.0, default: 2.0 }
    roles: [control, expert]
    presentation: 
      tab: "SETUP"
      group: "SAFEGUARDS"
      order: 1
      ui: { component: knob, ui_precision: 1, attachments: [{ type: "display", unit: "ms" }] }
