id: "test_probe"
name: "PROBE"
family: "Utility"
engine: "Modular"
implementationId: 505
status: "active"
version: 1
description: "Minimal verification probe (Era 5.2 Certified)."

layout:
  hp: 6
  columns: 1

registry:
  - id: "gain"
    label: "GAIN"
    roles: ["control", "mod_target"]
    direction: "internal"
    range: { min: 0, max: 1, default: 0.5 }
    presentation: { tab: "MAIN", group: "CONTROL", order: 1, ui: { component: "knob" } }

  - id: "sig_in"
    label: "IN"
    roles: ["input", "stream"]
    direction: "input"
    type: "audio"
    presentation: { tab: "PATCHING", group: "INPUTS", order: 1 }

  - id: "sig_out"
    label: "OUT"
    roles: ["output", "stream"]
    direction: "output"
    type: "audio"
    presentation: { tab: "PATCHING", group: "OUTPUTS", order: 2 }
