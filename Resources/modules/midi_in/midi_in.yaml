id: "midi_in"
name: "MIDI Input"
family: "Utility"
engine: "Modular"
modelId: "ACE-UTIL-MIDI-IN"
implementationId: 501
version: 1
status: "active"
description: "Aseptic MIDI bridge (Era 5.2 Certified). Passes all host MIDI data to the engine."

layout:
  hp: 6
  columns: 1

registry:
  - id: "midi_data"
    label: "MIDI OUT"
    roles: ["output", "stream"]
    direction: "output"
    type: "midi"
    presentation: { tab: "PATCHING", group: "SOURCES", order: 1 }

  - id: "activity"
    label: "ACTIVITY"
    roles: ["telemetry"]
    direction: "internal"
    presentation: { tab: "MAIN", group: "STATUS", order: 2, ui: { component: "led" } }
