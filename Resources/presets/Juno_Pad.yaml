preset:
  metadata:
    name: "Juno 106 Pad"
    author: "ABD"
    category: "Pad"
    tags: ["Analog", "Juno", "Soft"]
    engine: "VirtualAnalog"
    masterGainDb: -3.0
  layers:
    - id: "layer.a"
      name: "Juno Layer"
      active: true
      gainDb: 0.0
      architecture:
        oscillators:
          - slotName: "Osc1"
            componentId: "OSC-VA-001" # Roland Juno DCO
        filters:
          - slotName: "Filter1"
            componentId: "FLT-VA-001" # Roland IR3109
        envelopes:
          - slotName: "AmpEnv"
            componentId: "ENV-ADSR-GEN"
        fxSlots:
          - slotName: "FX1"
            componentId: "FX-CH-001" # Juno Chorus
      params:
        cutoff: 1200.0
        resonance: 0.1
        attack: 150.0
        decay: 300.0
        sustain: 0.8
        release: 1000.0
