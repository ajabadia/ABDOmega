id: OSC-VA-001
name: JUNO DCO
family: Oscillator
description: "Authentic digitally controlled oscillator from the Roland Juno-60 era. Features Saw, Pulse, and Sub-oscillator sections with PWM."
icon: osc-va
engine: VirtualAnalog
modelId: DCO-60
version: 1
panelClass: juno-panel
parameters:
  - id: layer.a.osc.saw.on
    label: SAW
    type: toggle
  - id: layer.a.osc.pulse.on
    label: PULSE
    type: toggle
  - id: layer.a.osc.sub.level
    label: SUB
    min: 0
    max: 1
  - id: layer.a.osc.noise.level
    label: NOISE
    min: 0
    max: 1
  - id: layer.a.osc.lfo.depth
    label: LFO
    min: 0
    max: 1
  - id: layer.a.osc.pwm.amount
    label: PWM
    min: 0
    max: 1
uiLayout:
  columns: 2
  gap: 12
  items:
    - { paramId: "layer.a.osc.saw.on",     control: "toggle",   label: "SAW",   row: 0, col: 0, variant: "juno-red" }
    - { paramId: "layer.a.osc.pulse.on",   control: "toggle",   label: "PULSE", row: 0, col: 1, variant: "juno-red" }
    - { paramId: "layer.a.osc.sub.level",  control: "slider-v", label: "SUB",   row: 1, col: 0 }
    - { paramId: "layer.a.osc.noise.level",control: "slider-v", label: "NOISE", row: 1, col: 1 }
    - { paramId: "layer.a.osc.lfo.depth",   control: "knob",     label: "LFO",   row: 2, col: 0 }
    - { paramId: "layer.a.osc.pwm.amount",  control: "slider-v", label: "PWM",   row: 2, col: 1 }
footer:
  label: "DIGITALLY CONTROLLED OSC"
