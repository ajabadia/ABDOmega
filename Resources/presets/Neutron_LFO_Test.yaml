# OMEGA Era 6.3: Aseptic Modulation Test
name: "Neutron LFO Test"
author: "Antigravity"
version: 6.3

# Layer configuration
layers:
  - id: "layer.0"
    name: "Modulation Demo"
    modules:
      - id: "neutron_lfo"
        instanceId: "lfo1"
        engine: "WASM"
        params:
          rate: 1.5
          waveform: 1 # Triangle
      - id: "ladder_filter"
        instanceId: "filter1"
        params:
          cutoff: 440.0
          resonance: 0.5

# Modulation Patchbay (Aseptic Matrix)
patchbayMatrix:
  - source: "lfo1.lfo_out"
    target: "filter1.cutoff"
    amount: 0.75
    active: true
  - source: "lfo1.rate"
    target: "lfo1.waveform"
    amount: 0.1
    active: false # Test inactive state

# Configuración visual
visual:
  scope:
    mode: "MODULATION"
    modulation:
      sourceA: "lfo1.lfo_out"
